<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真人名模虛擬試衣間</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 20px; display: flex; height: 100vh; box-sizing: border-box; }
        .container { display: flex; width: 100%; gap: 20px; height: 100%; }
        
        /* 左側控制面板 */
        .panel { width: 320px; background: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .panel h3 { margin: 0; font-size: 18px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .upload-group { background: #0f172a; padding: 15px; border-radius: 8px; }
        .upload-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #94a3b8; }
        .file-btn { width: 100%; background: #334155; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; }
        .select-input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 8px; border-radius: 6px; margin-bottom: 15px; }
        .submit-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #0369a1; }

        /* 中間：真人舞台區 */
        .stage-area { flex: 1; background: #020617; border-radius: 12px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .canvas-window { position: relative; width: 380px; height: 550px; display: flex; justify-content: center; align-items: center; background: #0f172a; border-radius: 8px; overflow: hidden; }
        
        /* 🧍‍♀️ 完整真人模特兒底圖 (Unsplash 高清合法真人美照) */
        .model-base { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        /* 👗 衣服疊加層：自動過濾白底 */
        .clothes-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 5; mix-blend-mode: multiply; }
        .clothes-layer img { object-fit: contain; width: 100%; height: 100%; }

        /* 📐 精準縮放校對：讓上傳的實體衣服完美穿在名模身上 */
        #layer-top img   { transform: scale(0.68) translateY(-38px) translateX(2px); }
        #layer-skirt img { transform: scale(0.72) translateY(122px) translateX(2px); }

        .status-tag { margin-top: 15px; font-size: 13px; color: #38bdf8; background: #1e293b; padding: 6px 16px; border-radius: 20px; }
        .reset-btn { background: #334155; color: #94a3b8; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; margin-top: 10px; }

        /* 右側衣櫥 */
        .wardrobe { width: 300px; background: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .grid { display: grid; grid-template-cols: repeat(2, 1fr); gap: 10px; overflow-y: auto; flex: 1; }
        .card { background: #0f172a; border: 2px solid #334155; border-radius: 8px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; padding: 5px; cursor: pointer; position: relative; }
        .card.active { border-color: #f59e0b; }
        .card img { width: 100%; height: 100%; object-fit: contain; }
        .card-tag { position: absolute; bottom: 4px; right: 4px; font-size: 9px; background: #334155; color: #94a3b8; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="panel">
        <h3>試衣間控制台</h3>
        <div class="upload-group">
            <label>1. 上傳實體衣服照片：</label>
            <input type="file" id="fileSelector" class="file-btn" accept="image/*" onchange="onFileLoaded(event)">
            
            <label>2. 設定衣服分類部位：</label>
            <select id="bodyPart" class="select-input">
                <option value="top" selected>上半身 / 上衣外套</option>
                <option value="skirt">下半身 / 長短裙褲</option>
            </select>
            
            <button class="submit-btn" onclick="injectToCloset()">⚡ 馬上穿在模特兒身上</button>
        </div>
    </div>

    <div class="stage-area">
        <div class="canvas-window">
            <img class="model-base" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop" alt="真人模特兒">
            
            <div class="clothes-layer" id="layer-top"></div>
            <div class="clothes-layer" id="layer-skirt"></div>
        </div>
        <div class="status-tag">當前狀態：160cm 完整真人模特兒試衣中</div>
        <button class="reset-btn" onclick="resetStage()">一鍵脫掉衣服 🔄</button>
    </div>

    <div class="wardrobe">
        <h3 style="color:#f59e0b; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top:0;">📦 我的專屬衣櫥</h3>
        <div class="grid" id="closetGrid"></div>
    </div>

</div>

<script>
    let tempImageSrc = null;
    let outfitMemory = { top: null, skirt: null };

    function onFileLoaded(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            tempImageSrc = e.target.result;
            alert("📸 衣服加載成功！請點擊「馬上穿在模特兒身上」。");
        };
        reader.readAsDataURL(file);
    }

    function injectToCloset() {
        if (!tempImageSrc) {
            alert("❌ 請先選擇檔案上傳衣服相片！");
            return;
        }

        const part = document.getElementById('bodyPart').value;
        const grid = document.getElementById('closetGrid');

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${tempImageSrc}"><span class="card-tag">${part.toUpperCase()}</span>`;
        
        card.onclick = function() {
            executeWear(part, tempImageSrc, card);
        };

        grid.insertBefore(card, grid.firstChild);
        executeWear(part, tempImageSrc, card);
        
        document.getElementById('fileSelector').value = "";
        tempImageSrc = null;
    }

    function executeWear(part, srcUrl, cardObj) {
        const layer = document.getElementById(`layer-${part}`);

        if (cardObj.classList.contains('active')) {
            cardObj.classList.remove('active');
            layer.innerHTML = '';
            outfitMemory[part] = null;
        } else {
            const all = document.querySelectorAll('.card');
            all.forEach(c => {
                if (c.querySelector('.card-tag').innerText.toLowerCase() === part) {
                    c.classList.remove('active');
                }
            });

            cardObj.classList.add('active');
            layer.innerHTML = `<img src="${srcUrl}">`;
            outfitMemory[part] = srcUrl;
        }
    }

    function resetStage() {
        document.getElementById('layer-top').innerHTML = '';
        document.getElementById('layer-skirt').innerHTML = '';
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        outfitMemory = { top: null, skirt: null };
    }
</script>

</body>
</html>
