<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的開源純前端西洋棋網站 (修復版)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { background-color: #161512; color: #bababa; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #fff; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #7c7c7c; margin-bottom: 20px; font-size: 14px; }
        
        #myBoard { width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
        
        .status-panel { width: 480px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; background: #262421; padding: 12px; border-radius: 6px; box-sizing: border-box; }
        .status { font-weight: bold; color: #f0d9b5; font-size: 14px; }
        .btn { background: #312e2b; color: #ccc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn:hover { background: #45413c; color: #fff; }
    </style>
</head>
<body>

    <h1>♟️ 我的專屬西洋棋俱樂部</h1>
    <div class="subtitle">純前端 JavaScript 引擎驅動 · 支援全套官方規則判斷</div>

    <div id="myBoard"></div>

    <div class="status-panel">
        <div class="status" id="status">輪到白方進攻...</div>
        <button class="btn" onclick="resetGame()">重新開局 🔄</button>
    </div>

<script>
    let board = null;
    let game = new Chess();
    const statusEl = document.getElementById('status');

    // 棋子被滑鼠抓起時的判斷
    function onDragStart(source, piece, position, orientation) {
        if (game.game_over()) return false;

        // 白方回合只能抓白棋 (w)，黑方回合只能抓黑棋 (b)
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
            return false;
        }
    }

    // 棋子被放下（移動）時的判斷
    function onDrop(source, target) {
        let move = game.move({
            from: source,
            to: target,
            promotion: 'q' // 預設自動升變為皇后
        });

        // 走法不合法時彈回
        if (move === null) return 'snapback';

        updateStatus();
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'b' ? '黑方' : '白方';

        if (game.in_checkmate()) {
            status = `遊戲結束！${moveColor} 被將死 (Checkmate) 💀`;
        } else if (game.in_draw()) {
            status = '遊戲結束！雙方和棋 (Draw) 🤝';
        } else {
            status = `輪到【${moveColor}】進攻`;
            if (game.in_check()) {
                status += ' ⚠️ ( 被將軍 Check! )';
            }
        }

        statusEl.innerText = status;
    }

    function resetGame() {
        game.reset();
        board.start();
        updateStatus();
    }

    // 🔴 【核心修復機制】強制將棋子圖片導向雲端 CDN，徹底解決本地開檔破圖問題！
    function pieceTheme(piece) {
        // piece 會傳入像 'wP' (白兵), 'bK' (黑王) 這樣的代號
        // 我們把它對應到 cdnjs 上的標準維基百科棋子風格圖片
        return 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/' + piece + '.png';
    }

    const config = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        pieceTheme: pieceTheme // 注入我們修復後的圖片路徑邏輯
    };

    board = Chessboard('myBoard', config);
    updateStatus();
</script>

</body>
</html>
