<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的開源純前端西洋棋網站</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { background-color: #161512; color: #bababa; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #fff; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #7c7c7c; margin-bottom: 20px; font-size: 14px; }
        
        /* 棋盤容器 */
        #myBoard { width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
        
        /* 狀態控制面板 */
        .status-panel { width: 480px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; background: #262421; padding: 12px; border-radius: 6px; box-sizing: border-box; }
        .status { font-weight: bold; color: #f0d9b5; font-size: 14px; }
        .btn { background: #312e2b; color: #ccc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn:hover { background: #45413c; color: #fff; }
    </style>
</head>
<body>

    <h1>♟️ 我的專屬西洋棋俱樂部</h1>
    <div class="subtitle">純前端 JavaScript 引擎驅動 · 支援全套官方規則判斷</div>

    <div id="myBoard"></div>

    <div class="status-panel">
        <div class="status" id="status">輪到白方進攻...</div>
        <button class="btn" onclick="resetGame()">重新開局 🔄</button>
    </div>

<script>
    let board = null;
    let game = new Chess(); // 初始化 Chess.js 規則大腦
    const statusEl = document.getElementById('status');

    // 棋子被滑鼠抓起時的判斷
    function onDragStart(source, piece, position, orientation) {
        // 如果遊戲已經結束，或者抓了對方顏色的棋子，就不能拖動
        if (game.game_over()) return false;

        // 白方回合只能抓白棋 (w)，黑方回合只能抓黑棋 (b)
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
            return false;
        }
    }

    // 棋子被放下（移動）時的判斷
    function onDrop(source, target) {
        // 檢查這一動是否符合西洋棋規則
        let move = game.move({
            from: source,
            to: target,
            promotion: 'q' // 兵走到對底線時，預設自動升變為皇后 (Queen)
        });

        // 如果 move 回傳 null，代表是不合法的走法（例如主教穿過棋子、王自己撞將軍），棋子會自動彈回原位
        if (move === null) return 'snapback';

        updateStatus();
    }

    // 當棋子移動動畫結束後，重新整理棋盤狀態
    function onSnapEnd() {
        board.position(game.fen());
    }

    // 更新遊戲狀態與文字提示（王車易位、被將軍、和棋、國王駕崩等判斷）
    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'b' ? '黑方' : '白方';

        if (game.in_checkmate()) {
            status = `遊戲結束！${moveColor} 被將死 (Checkmate) 💀`;
        } else if (game.in_draw()) {
            status = '遊戲結束！雙方和棋 (Draw) 🤝';
        } else {
            status = `輪到【${moveColor}】進攻`;
            if (game.in_check()) {
                status += ' ⚠️ ( 被將軍 Check! )';
            }
        }

        statusEl.innerText = status;
    }

    // 重新開局
    function resetGame() {
        game.reset();
        board.start();
        updateStatus();
    }

    // 棋盤設定參數
    const config = {
        draggable: true,         // 允許滑鼠拖拽棋子
        position: 'start',        // 棋子初始標準排列
        onDragStart: onDragStart, // 綁定抓起事件
        onDrop: onDrop,           // 綁定放下事件
        onSnapEnd: onSnapEnd      // 綁定動畫修正
    };

    // 啟動 Chessboard.js 棋盤
    board = Chessboard('myBoard', config);
    updateStatus();
</script>

</body>
</html>
